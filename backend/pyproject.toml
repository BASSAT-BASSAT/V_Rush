[project]
name = "kernellab-backend"
version = "0.2.0"
description = "V-Rush FastAPI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "python-multipart>=0.0.9,<1",
    "opencv-python-headless>=4.9.0,<5",
    "numpy>=1.26.0,<3",
    "pydantic>=2.5.0,<3",
    "PyJWT>=2.8.0,<3",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/cv_ops/param_help.py" = ["E501"]
